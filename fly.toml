app = "pvpskill-backend"
primary_region = "fra"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DATA_DIR = "/data"

[[mounts]]
  source = "pvpskill_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
